<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='none' stroke='%23111' stroke-width='2'/%3E%3C/svg%3E">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #c { position:fixed; inset:0; display:block; touch-action:none; cursor:crosshair; }
  #bar { position:fixed; top:12px; right:12px; display:flex; align-items:center; gap:8px; background:#fff;
    border:1px solid #e5e5e5; border-radius:10px; padding:6px 8px; box-shadow:0 2px 8px rgba(0,0,0,.06);
    user-select:none; -webkit-user-select:none; z-index:10; }
  .sw { width:22px; height:22px; border-radius:50%; border:2px solid transparent; box-sizing:border-box; cursor:pointer; }
  .sw.on { border-color:#111; box-shadow:inset 0 0 0 2px #fff; }
  .sep { width:1px; height:22px; background:#e5e5e5; margin:0 4px; }
  button { font-size:13px; font-family:inherit; padding:5px 10px; border:1px solid #ddd; background:#fff;
    border-radius:7px; cursor:pointer; color:#111; }
  button:hover { background:#f5f5f5; }
  #pal { position:fixed; display:none; flex-direction:column; width:200px; background:#fff; border:1px solid #ddd;
    border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); overflow:hidden; z-index:20; }
  #pal input { border:0; outline:0; padding:8px 10px; font-size:14px; font-family:inherit; border-bottom:1px solid #eee; }
  #pal .opt { padding:7px 10px; font-size:14px; cursor:pointer; }
  #pal .opt.hi { background:#eef3ff; }
  #ed { position:fixed; display:none; border:0; outline:0; background:transparent; resize:none; overflow:hidden;
    padding:0; margin:0; color:#111; line-height:1.25; white-space:pre-wrap; overflow-wrap:break-word; z-index:5; }
  #ask { position:fixed; top:12px; left:12px; right:400px; max-width:720px; display:flex; align-items:center; gap:8px; z-index:10; }
  #askin { flex:1; min-width:140px; font-size:14px; font-family:inherit; padding:7px 12px; border:1px solid #e5e5e5; border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.06); outline:none; background:#fff; color:#111; }
  #askin:focus { border-color:#4c8dff; }
  #askst { font-size:12px; color:#888; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  #hint { position:fixed; left:12px; bottom:10px; font-size:12px; color:#999; user-select:none; pointer-events:none; }
  #toast { position:fixed; top:60px; right:16px; background:#111; color:#fff; font-size:13px; padding:6px 10px;
    border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<textarea id="ed" spellcheck="false"></textarea>
<div id="pal"><input id="palin" placeholder="rectangle, circle, triangle, arrow, text" autocomplete="off"><div id="palopts"></div></div>
<form id="ask" autocomplete="off"><input id="askin" placeholder="Tell it what to do: add a red circle, label the boxes, connect them, clear, undo…"><span id="askst"></span></form>
<div id="bar"></div>
<div id="hint">just type &middot; click to type elsewhere &middot; double-click for a text box &middot; drag to draw &middot; / for shapes &middot; &#9003; deletes &middot; &#8984;Z undo</div>
<div id="toast"></div>
<script>
(() => {
'use strict';
const COLORS = [['black','#111111'],['red','#e03131'],['blue','#1c7ed6'],['green','#2f9e44'],['orange','#f08c00']];
const HEX = Object.fromEntries(COLORS);
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
const LW = 2.5, PAD = 6, LH = 1.25, HIT = 8, HS = 8, PLAIN_FS = 16;
const ORIGIN = { x: 40, y: 76 + PLAIN_FS * LH / 2 }; // where the page's own text starts, like a doc (below the prompt bar)
const API = (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) ? 'http://localhost:8787' : 'https://scratchpad-api-3udy.onrender.com';
const CMDS = ['rectangle','circle','triangle','arrow','text'];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ed = document.getElementById('ed'), pal = document.getElementById('pal');
const palin = document.getElementById('palin'), palopts = document.getElementById('palopts');
const bar = document.getElementById('bar'), toast = document.getElementById('toast');
const askForm = document.getElementById('ask'), askin = document.getElementById('askin'), askst = document.getElementById('askst');

let objects = [], sel = null, color = 'black';
let mouse = { x: innerWidth / 2, y: innerHeight / 2 };
let undoStack = [], redoStack = [];
let drag = null, editing = null, dpr = 1, fresh = null, docText = null;
let nextId = 1, lastJSON = null, lastInputAt = 0; // ids survive undo snapshots; lastJSON = state before the current typing burst
const oid = () => nextId++;
let palHi = 0, palList = [];

// ---------- toolbar ----------
COLORS.forEach(([name, hex], i) => {
  const d = document.createElement('div');
  d.className = 'sw' + (i === 0 ? ' on' : ''); d.style.background = hex; d.title = name;
  d.onmousedown = e => e.preventDefault();
  d.onclick = () => { setPen(name); if (sel && sel.type !== 'text') { snapshot(); sel.color = name; render(); } };
  bar.appendChild(d);
});
function setPen(name) { if (!HEX[name]) return; color = name; bar.querySelectorAll('.sw').forEach(el => el.classList.toggle('on', el.title === name)); }
const mkBtn = (label, title, fn) => {
  const b = document.createElement('button'); b.textContent = label; b.title = title;
  b.onmousedown = e => e.preventDefault(); b.onclick = fn; bar.appendChild(b); return b;
};
const sep = document.createElement('div'); sep.className = 'sep'; bar.appendChild(sep);
mkBtn('Copy', 'Copy the diagram as plain text (shapes, labels, arrows) for pasting into Claude Code', copyDesc);
mkBtn('Download', 'Download the diagram as a PNG image', exportPNG);
mkBtn('Clear', 'Clear the canvas (undo with ⌘Z)', () => { if (editing) stopEdit(); if (!objects.length) return; snapshot(); objects = []; sel = null; render(); });

function showToast(msg) { toast.textContent = msg; toast.style.opacity = 1; clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.style.opacity = 0, 1400); }

// ---------- undo ----------
function pushUndo(json) { undoStack.push(json); if (undoStack.length > 200) undoStack.shift(); redoStack.length = 0; }
function snapshot() { pushUndo(JSON.stringify(objects)); }
function restoreState(json) {
  const wasEditing = editing ? editing.id : null;
  objects = JSON.parse(json); sel = null;
  if (wasEditing != null) {
    const t = objects.find(o => o.id === wasEditing && o.type === 'text');
    if (t) { editing = t; sel = t; ed.value = t.text; placeEd(); ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
    else { editing = null; fresh = null; ed.style.display = 'none'; }
  }
  lastJSON = JSON.stringify(objects); lastInputAt = 0;
  render();
}
function undo() { closePal(); if (!undoStack.length) return; redoStack.push(JSON.stringify(objects)); restoreState(undoStack.pop()); }
function redo() { closePal(); if (!redoStack.length) return; undoStack.push(JSON.stringify(objects)); restoreState(redoStack.pop()); }

// ---------- geometry ----------
const clone = o => JSON.parse(JSON.stringify(o));
function bbox(o) {
  if (o.type === 'arrow') return { x: Math.min(o.x1, o.x2), y: Math.min(o.y1, o.y2), w: Math.abs(o.x2 - o.x1), h: Math.abs(o.y2 - o.y1) };
  if (o.type === 'stroke') {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const p of o.points) { if (p.x < x1) x1 = p.x; if (p.y < y1) y1 = p.y; if (p.x > x2) x2 = p.x; if (p.y > y2) y2 = p.y; }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  return { x: o.x, y: o.y, w: o.w, h: o.h };
}
function dseg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
const inside = (px, py, b) => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
const triPts = o => [[o.x + o.w / 2, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]];
function nearPoly(px, py, pts) {
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if (dseg(px, py, a[0], a[1], b[0], b[1]) <= HIT) return true; }
  return false;
}
function hitObj(o, px, py) {
  if (o.type === 'stroke') return false;
  if (o.type === 'text') return px >= o.x && px <= o.x + o.w && py >= o.y && py <= o.y + o.h;
  if (o.type === 'arrow') return dseg(px, py, o.x1, o.y1, o.x2, o.y2) <= HIT;
  if (o.type === 'rect') return nearPoly(px, py, [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]]);
  if (o.type === 'triangle') return nearPoly(px, py, triPts(o));
  if (o.type === 'circle') {
    const rx = o.w / 2, ry = o.h / 2; if (rx < 1 || ry < 1) return false;
    const r = Math.hypot((px - o.x - rx) / rx, (py - o.y - ry) / ry);
    return Math.abs(r - 1) * Math.min(rx, ry) <= HIT;
  }
  return false;
}
function handles(o) {
  if (o.type === 'text' && o.plain) return [];
  if (o.type === 'arrow') return [{ id: 'p1', x: o.x1, y: o.y1, cur: 'move' }, { id: 'p2', x: o.x2, y: o.y2, cur: 'move' }];
  const { x, y, w, h } = bbox(o);
  return [
    { id: 'nw', x, y, cur: 'nwse-resize' }, { id: 'n', x: x + w / 2, y, cur: 'ns-resize' }, { id: 'ne', x: x + w, y, cur: 'nesw-resize' },
    { id: 'e', x: x + w, y: y + h / 2, cur: 'ew-resize' }, { id: 'se', x: x + w, y: y + h, cur: 'nwse-resize' },
    { id: 's', x: x + w / 2, y: y + h, cur: 'ns-resize' }, { id: 'sw', x, y: y + h, cur: 'nesw-resize' }, { id: 'w', x, y: y + h / 2, cur: 'ew-resize' }];
}
function hitHandle(o, px, py) { if (!o) return null; for (const h of handles(o)) if (Math.abs(px - h.x) <= HS && Math.abs(py - h.y) <= HS) return h; return null; }
function topHit(px, py) { for (let i = objects.length - 1; i >= 0; i--) if (hitObj(objects[i], px, py)) return objects[i]; return null; }
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y); return L; }
function moveTo(o, orig, dx, dy) {
  if (o.type === 'arrow') { o.x1 = orig.x1 + dx; o.y1 = orig.y1 + dy; o.x2 = orig.x2 + dx; o.y2 = orig.y2 + dy; }
  else if (o.type === 'stroke') { o.points = orig.points.map(p => ({ x: p.x + dx, y: p.y + dy })); }
  else { o.x = orig.x + dx; o.y = orig.y + dy; }
}
function resizeTo(o, orig, h, dx, dy) {
  if (o.type === 'arrow') { if (h === 'p1') { o.x1 = orig.x1 + dx; o.y1 = orig.y1 + dy; } else { o.x2 = orig.x2 + dx; o.y2 = orig.y2 + dy; } return; }
  let x = orig.x, y = orig.y, w = orig.w, hh = orig.h;
  if (h.includes('w')) { x += dx; w -= dx; } if (h.includes('e')) w += dx;
  if (h.includes('n')) { y += dy; hh -= dy; } if (h.includes('s')) hh += dy;
  if (w < 0) { x += w; w = -w; } if (hh < 0) { y += hh; hh = -hh; }
  o.x = x; o.y = y; o.w = Math.max(w, 10); o.h = Math.max(hh, 10);
}

// ---------- text fitting ----------
function wrapLines(text, fs, maxW) {
  ctx.font = fs + 'px ' + FONT;
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const cand = line ? line + ' ' + word : word;
      if (ctx.measureText(cand).width <= maxW) { line = cand; continue; }
      if (line) { lines.push(line); line = ''; }
      if (ctx.measureText(word).width <= maxW) { line = word; continue; }
      let chunk = '';
      for (const ch of word) { if (!chunk || ctx.measureText(chunk + ch).width <= maxW) chunk += ch; else { lines.push(chunk); chunk = ch; } }
      line = chunk;
    }
    lines.push(line);
  }
  return lines;
}
function fitFont(t) {
  const iw = Math.max(1, t.w - 2 * PAD), ih = Math.max(1, t.h - 2 * PAD);
  const txt = t.text || 'Ag';
  let lo = 6, hi = Math.min(400, Math.floor(ih / LH));
  if (hi <= lo) return lo;
  while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); const n = wrapLines(txt, mid, iw).length; if (n * mid * LH <= ih) lo = mid; else hi = mid - 1; }
  return lo;
}

function plainMaxW(t) { return Math.max(60, Math.min(820, innerWidth - t.x - 2 * PAD - 40)); }
function layoutText(t) {
  if (t.plain) {
    const maxW = plainMaxW(t), lines = wrapLines(t.text, PLAIN_FS, maxW);
    ctx.font = PLAIN_FS + 'px ' + FONT;
    let w = 0; for (const ln of lines) w = Math.max(w, ctx.measureText(ln).width);
    t.w = Math.max(12, Math.ceil(w)) + 2 * PAD; t.h = lines.length * PLAIN_FS * LH + 2 * PAD;
    return { fs: PLAIN_FS, lines, maxW, cw: Math.ceil(w) };
  }
  const fs = fitFont(t);
  return { fs, lines: wrapLines(t.text, fs, Math.max(1, t.w - 2 * PAD)), maxW: Math.max(1, t.w - 2 * PAD) };
}

// ---------- rendering ----------
function fit() { dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; render(); }
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  drawScene(ctx, objects, 0, 0, editing);
  if (sel && objects.includes(sel)) drawSel(ctx, sel);
}
function drawScene(c, objs, ox, oy, skipText) {
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = LW;
  for (const o of objs) {
    c.strokeStyle = HEX[o.color] || '#111'; c.fillStyle = c.strokeStyle;
    if (o.type === 'stroke') drawStroke(c, o, ox, oy);
    else if (o.type === 'rect') c.strokeRect(o.x + ox, o.y + oy, o.w, o.h);
    else if (o.type === 'circle') { c.beginPath(); c.ellipse(o.x + ox + o.w / 2, o.y + oy + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2); c.stroke(); }
    else if (o.type === 'triangle') { const p = triPts(o); c.beginPath(); c.moveTo(p[0][0] + ox, p[0][1] + oy); c.lineTo(p[1][0] + ox, p[1][1] + oy); c.lineTo(p[2][0] + ox, p[2][1] + oy); c.closePath(); c.stroke(); }
    else if (o.type === 'arrow') drawArrow(c, o, ox, oy);
    else if (o.type === 'text') { if (o !== skipText) drawText(c, o, ox, oy); }
  }
}
function drawStroke(c, o, ox, oy) {
  const P = o.points; if (!P.length) return;
  c.beginPath(); c.moveTo(P[0].x + ox, P[0].y + oy);
  if (P.length < 3) { for (const p of P) c.lineTo(p.x + ox, p.y + oy); c.stroke(); return; }
  for (let i = 1; i < P.length - 1; i++) c.quadraticCurveTo(P[i].x + ox, P[i].y + oy, (P[i].x + P[i + 1].x) / 2 + ox, (P[i].y + P[i + 1].y) / 2 + oy);
  const L = P[P.length - 1]; c.lineTo(L.x + ox, L.y + oy); c.stroke();
}
function drawArrow(c, o, ox, oy) {
  const x1 = o.x1 + ox, y1 = o.y1 + oy, x2 = o.x2 + ox, y2 = o.y2 + oy;
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.min(14, Math.max(6, Math.hypot(x2 - x1, y2 - y1) / 3));
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - (L - 2) * Math.cos(a), y2 - (L - 2) * Math.sin(a)); c.stroke();
  c.beginPath(); c.moveTo(x2, y2);
  c.lineTo(x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45));
  c.lineTo(x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45));
  c.closePath(); c.fill();
}
function drawText(c, o, ox, oy) {
  const { fs, lines } = layoutText(o);
  c.font = fs + 'px ' + FONT; c.fillStyle = '#111'; c.textBaseline = 'top';
  let y = o.y + oy + PAD + fs * (LH - 1) / 2;
  for (const ln of lines) { c.fillText(ln, o.x + ox + PAD, y); y += fs * LH; }
}
function drawSel(c, o) {
  if (o.plain) return;
  c.save(); c.lineWidth = 1; c.strokeStyle = '#4c8dff'; c.setLineDash([4, 3]);
  const b = bbox(o); if (o.type !== 'arrow') c.strokeRect(b.x - 0.5, b.y - 0.5, b.w + 1, b.h + 1);
  c.setLineDash([]); c.fillStyle = '#fff';
  for (const h of handles(o)) { c.fillRect(h.x - 4, h.y - 4, 8, 8); c.strokeRect(h.x - 3.5, h.y - 3.5, 7, 7); }
  c.restore();
}

// ---------- text editing ----------
function placeEd() {
  const t = editing; if (!t) return;
  const { fs, lines, maxW, cw } = layoutText(t);
  ed.style.left = (t.x + PAD) + 'px'; ed.style.top = (t.y + PAD) + 'px';
  ed.style.fontSize = fs + 'px'; ed.style.fontFamily = FONT;
  if (t.plain) {
    // textarea hugs the typed text so clicks inside it place the caret, clicks beside it reach the canvas
    ed.style.width = Math.min(maxW, cw + 4) + 'px'; ed.style.height = ((lines.length + 1) * fs * LH) + 'px';
    ed.style.pointerEvents = t.text ? 'auto' : 'none';
  }
  else { ed.style.width = Math.max(4, t.w - 2 * PAD) + 'px'; ed.style.height = Math.max(4, t.h - 2 * PAD) + 'px'; ed.style.pointerEvents = 'auto'; }
}
function startEdit(t, before) {
  if (editing === t) return;
  if (editing) stopEdit();
  closePal();
  editing = t; sel = t; lastJSON = before || JSON.stringify(objects); lastInputAt = 0;
  if (t.plain) docText = t;
  ed.value = t.text; ed.style.display = 'block'; placeEd(); render();
  ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length);
}
function stopEdit(keepEmpty) {
  if (!editing) return;
  const t = editing; editing = null; ed.style.display = 'none';
  t.text = ed.value.replace(/\s+$/, '');
  if (!t.text.trim() && !keepEmpty) { const i = objects.indexOf(t); if (i >= 0) objects.splice(i, 1); if (sel === t) sel = null; }
  if (sel === t && t.plain) sel = null;
  if (fresh && fresh.o === t) fresh = null;
  render();
}
// every keystroke goes through here; a pause of 700ms starts a new undo group (one Cmd+Z = one typing burst)
function onInput() {
  if (!editing) return;
  const now = Date.now();
  if (now - lastInputAt > 700) pushUndo(lastJSON);
  lastInputAt = now;
  editing.text = ed.value; placeEd();
  lastJSON = JSON.stringify(objects);
}
// single click on empty canvas: start typing right there at normal page size, no box
function startPlain(p) {
  const before = JSON.stringify(objects);
  const t = { id: oid(), type: 'text', plain: true, color: 'black', x: p.x - PAD, y: p.y - PAD - PLAIN_FS * LH / 2, w: 12 + 2 * PAD, h: PLAIN_FS * LH + 2 * PAD, text: '' };
  if (p === ORIGIN) t.doc = true;
  objects.push(t); fresh = { o: t, x: p.x, y: p.y, t0: Date.now() }; startEdit(t, before);
}
// typing with nothing focused continues the page text (last plain text edited, else the doc text at top-left, else a new one)
function typeInDoc(ch) {
  const t = (docText && objects.includes(docText)) ? docText : objects.find(o => o.type === 'text' && o.plain && o.doc);
  if (t) startEdit(t); else startPlain(ORIGIN);
  ed.value += ch; onInput(); ed.setSelectionRange(ed.value.length, ed.value.length);
}
ed.addEventListener('input', onInput);
ed.addEventListener('keydown', e => {
  e.stopPropagation();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (e.key === 'Escape') { e.preventDefault(); stopEdit(); return; }
  if (e.key === '/' && !e.metaKey && !e.ctrlKey) { // slash at the start of a word opens the shape menu, mid-word it is just a slash
    const i = ed.selectionStart; if (i === 0 || /\s/.test(ed.value[i - 1])) { e.preventDefault(); openPal(); }
  }
});
ed.addEventListener('blur', () => { if (editing) stopEdit(); });

function createText(p) {
  let best = null;
  for (const o of objects) if (o.type === 'rect' && p.x >= o.x && p.x <= o.x + o.w && p.y >= o.y && p.y <= o.y + o.h) { if (!best || o.w * o.h < best.w * best.h) best = o; }
  const before = JSON.stringify(objects);
  let t;
  if (best) { const m = Math.min(10, best.w * 0.1, best.h * 0.1); t = { id: oid(), type: 'text', color: 'black', x: best.x + m, y: best.y + m, w: Math.max(20, best.w - 2 * m), h: Math.max(16, best.h - 2 * m), text: '' }; }
  else t = { id: oid(), type: 'text', color: 'black', x: p.x - 80, y: p.y - 20, w: 160, h: 40, text: '' };
